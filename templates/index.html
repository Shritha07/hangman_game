<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .hangman-drawing {
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.3;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            white-space: pre;
            color: #333;
            border: 2px solid #e9ecef;
            overflow: hidden;
        }

        .word-display {
            text-align: center;
            font-size: 2.5em;
            letter-spacing: 10px;
            margin-bottom: 30px;
            color: #333;
            font-weight: bold;
            min-height: 60px;
            word-wrap: break-word;
        }

        .info-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1em;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .attempts {
            color: #e74c3c;
            font-weight: bold;
        }

        .guessed-letters {
            color: #667eea;
            font-weight: bold;
            word-break: break-word;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid #667eea;
            border-radius: 10px;
            text-align: center;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
            transform: scale(1.02);
        }

        button {
            padding: 15px 30px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.3s ease-in;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
            display: block;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
            display: block;
        }

        .new-game-btn {
            width: 100%;
            margin-top: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .new-game-btn:hover {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
        }

        .stats {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 0.9em;
            color: #666;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .word-display {
                font-size: 1.8em;
                letter-spacing: 5px;
            }

            .hangman-drawing {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 Hangman Game</h1>

        <div class="hangman-drawing" id="hangman">
   --------
   |      |
   |
   |
   |
   |
   -
        </div>

        <div class="word-display" id="wordDisplay">_ _ _ _ _</div>

        <div class="info-section">
            <div class="attempts">❤️ Attempts: <span id="attemptsLeft">6</span></div>
            <div class="guessed-letters">🔤 Guessed: <span id="guessedLetters">None</span></div>
        </div>

        <div class="message" id="message"></div>

        <div class="input-section">
            <input type="text" id="letterInput" maxlength="1" placeholder="Enter a letter" autocomplete="off">
            <button onclick="guessLetter()">Guess</button>
        </div>

        <button class="new-game-btn" onclick="startNewGame()">🎲 New Game</button>

        <div class="stats">
            Made with ❤️ in PyCharm | Press Enter to guess
        </div>
    </div>

    <script>
        const hangmanStages = [
            `   --------
   |      |
   |      O
   |     \\|/
   |      |
   |     / \\
   -`,
            `   --------
   |      |
   |      O
   |     \\|/
   |      |
   |     /
   -`,
            `   --------
   |      |
   |      O
   |     \\|/
   |      |
   |
   -`,
            `   --------
   |      |
   |      O
   |     \\|
   |      |
   |
   -`,
            `   --------
   |      |
   |      O
   |      |
   |      |
   |
   -`,
            `   --------
   |      |
   |      O
   |
   |
   |
   -`,
            `   --------
   |      |
   |
   |
   |
   |
   -`
        ];

        async function startNewGame() {
            try {
                const response = await fetch('/new_game', { method: 'POST' });
                const data = await response.json();
                updateDisplay(data);
                document.getElementById('letterInput').value = '';
                document.getElementById('letterInput').focus();
                showMessage('New game started! Good luck! 🎮', 'info');
            } catch (error) {
                showMessage('Error starting game. Please refresh the page.', 'error');
            }
        }

        async function guessLetter() {
            const letterInput = document.getElementById('letterInput');
            const letter = letterInput.value.toLowerCase();

            if (!letter || !letter.match(/[a-z]/)) {
                showMessage('Please enter a valid letter! 🔤', 'error');
                return;
            }

            try {
                const response = await fetch('/guess', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ letter: letter })
                });

                const data = await response.json();
                updateDisplay(data);
                letterInput.value = '';
                letterInput.focus();

                if (data.message) {
                    showMessage(data.message, data.game_over ? 'info' : (data.correct ? 'success' : 'error'));
                }
            } catch (error) {
                showMessage('Error processing guess. Please try again.', 'error');
            }
        }

        function updateDisplay(data) {
            document.getElementById('wordDisplay').textContent = data.word_display;
            document.getElementById('attemptsLeft').textContent = data.attempts;
            document.getElementById('guessedLetters').textContent =
                data.guessed_letters.length > 0 ? data.guessed_letters.join(', ').toUpperCase() : 'None';
            document.getElementById('hangman').textContent = hangmanStages[data.attempts];
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;

            if (type !== 'info') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            }
        }

        document.getElementById('letterInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                guessLetter();
            }
        });

        window.onload = function() {
            startNewGame();
            document.getElementById('letterInput').focus();
        };
    </script>
</body>
</html>
